// Load signing credentials once for all modules (keystore.properties is git-ignored)
def keystorePropsFile = file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}
ext {
    RELEASE_STORE_FILE     = keystoreProps['storeFile']     ?: ''
    RELEASE_STORE_PASSWORD = keystoreProps['storePassword'] ?: ''
    RELEASE_KEY_ALIAS      = keystoreProps['keyAlias']      ?: ''
    RELEASE_KEY_PASSWORD   = keystoreProps['keyPassword']   ?: ''
}

// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        mavenCentral()
        google()
        maven { url 'https://developer.huawei.com/repo/' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.3.15'
        classpath 'com.huawei.agconnect:agcp:1.9.1.301'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20"
    }
}
repositories {
    google()
}